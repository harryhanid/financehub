<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Sahabat ETF</title>
<style>
body { display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #f3f4f6; margin: 0; font-family: sans-serif; }
.login-box { background: white; padding: 2.5rem 2rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); width: 100%; max-width: 350px; text-align: center; }
.login-box h2 { margin-top: 0; margin-bottom: 0.5rem; color: #1e293b; font-size: 1.5rem; }
.login-box p { color: #64748b; font-size: 0.875rem; margin-bottom: 1.5rem; }
.login-box input { width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-size: 1rem; outline: none; }
.login-box input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
.login-box button { width: 100%; padding: 0.75rem; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: background 0.2s; }
.login-box button:hover { background: #1d4ed8; }
.error { color: #ef4444; margin-top: 1rem; font-size: 0.875rem; }
</style>
</head>
<body>
<div class="login-box">
  <h2>Sahabat ETF</h2>
  <p>Masukkan security password untuk mengakses modul ini.</p>
  <form method="POST">
    <input type="password" name="password" placeholder="Password" required autofocus>
    <button type="submit">Masuk</button>
  </form>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
</div>
</body>
</html>
